# Nginx config — Giorno 10 Broken Project
events {
  worker_connections 1024;
}

http {
  upstream express_api {
    server api:3000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://express_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 🐛 BUG 1: SSE endpoint SENZA proxy_buffering off
    # Nginx bufferizza le risposte → il client riceve tutto alla fine
    location /api/ai/ {
      proxy_pass http://express_api;
      proxy_http_version 1.1;
      # Manca: proxy_buffering off;
      # Manca: proxy_cache off;
      # Manca: proxy_read_timeout 300s;
      # Manca: proxy_set_header Connection "";
    }

    location /health {
      proxy_pass http://express_api;
    }
  }
}
